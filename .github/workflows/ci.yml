name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  portable:
    name: Current stack fixtures (not native-source acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install isolated host test dependencies
        run: |
          python3 -m venv .agents/test-venv
          # .agents is operator-local/ignored; public CI provisions explicitly.
          .agents/test-venv/bin/python -m pip install -r infra/spartan-route/requirements.txt PyYAML==6.0.3 python-dotenv==1.2.1 packaging==26.3 requests==2.32.5 httpx==0.28.1 ruamel.yaml==0.18.16
          echo "$PWD/.agents/test-venv/bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts
      - name: Provision pinned Pi native loader in an isolated prefix
        run: |
          npm install --prefix .agents/pi-test --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0
          echo "PI_CODING_AGENT_DIR=$PWD/.agents/pi-test/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
      - name: Route, dashboard and Pi tests
        run: |
          npm run test:route
          npm run test:pi
      - name: Hermes fixtures (native source lane is separately required)
        run: npm run test:hermes
      - name: Operator helpers and full public Compose matrix
        run: npm run test:scripts
      - name: Reader, edge and Camofox fixtures
        run: |
          npm run test:reader
          python3 -m unittest discover -s infra/caddy -p 'test_edge_sessions.py'
          npm run test:camofox
      - name: Shell syntax and whitespace
        run: |
          find scripts apps/hermes-agent infra -name '*.sh' -type f -print0 | xargs -0 -r -n 1 bash -n
          git diff --check
      - name: Public Compose renders (never starts services)
        run: |
          docker compose -f infra/compose/compose.yml config --quiet
          docker compose -f infra/compose/compose.yml --env-file .env.example config --quiet
      - name: Explain remaining acceptance gates
        run: |
          echo 'Portable fixtures do not satisfy mandatory Hermes/Camofox pristine-source gates.'
          echo 'Native integration and TOP assurance require the explicitly provisioned inputs documented in docs/development.md.'
          echo 'No external home shared package is assumed or reported as CI enforcement.'

  native-source-required:
    name: Pinned native source integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Provision isolated native fixture dependencies
        run: |
          python3 -m venv .agents/test-venv
          .agents/test-venv/bin/python -m pip install -r infra/spartan-route/requirements.txt PyYAML==6.0.3 python-dotenv==1.2.1 packaging==26.3 requests==2.32.5 httpx==0.28.1 ruamel.yaml==0.18.16
          echo "$PWD/.agents/test-venv/bin" >> "$GITHUB_PATH"
      - name: Fetch immutable public program sources and verify archive bytes
        run: |
          mkdir -p .agents/native/hermes .agents/native/camofox
          curl -fL --retry 2 https://codeload.github.com/NousResearch/hermes-agent/tar.gz/e8c97320ac8691d4de92af49f98459f9ef9ddb08 -o .agents/native/hermes.tar.gz
          curl -fL --retry 2 https://codeload.github.com/jo-inc/camofox-browser/tar.gz/771b610a7b5994759c138b912741de58b0edd588 -o .agents/native/camofox.tar.gz
          echo '64f49146525ad21e63e4a9b0cf3418a35ead2173989a94c7b5e1304078625cf9  .agents/native/hermes.tar.gz' | sha256sum -c -
          echo '8fe0ae67988f29ee9da75c55aa277a8c2744c3cedbc53cdc53f2f1a04b0ee0a8  .agents/native/camofox.tar.gz' | sha256sum -c -
          tar -xzf .agents/native/hermes.tar.gz --strip-components=1 -C .agents/native/hermes
          tar -xzf .agents/native/camofox.tar.gz --strip-components=1 -C .agents/native/camofox
          npm ci --prefix .agents/native/camofox --ignore-scripts --omit=dev --no-audit --no-fund
          echo "HERMES_UPSTREAM_SOURCE=$PWD/.agents/native/hermes" >> "$GITHUB_ENV"
          echo "HERMES_SYNC_SOURCE=$PWD/.agents/native/hermes/tools/skills_sync.py" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PWD/.agents/native/hermes" >> "$GITHUB_ENV"
          echo "CAMOFOX_UPSTREAM_SOURCE=$PWD/.agents/native/camofox" >> "$GITHUB_ENV"
          echo "CAMOFOX_EXPRESS_MODULE=$PWD/.agents/native/camofox/node_modules/express" >> "$GITHUB_ENV"
      - name: Native patch chains and integrations (missing inputs fail)
        run: |
          npm run test:hermes:native
          npm run test:camofox:native
      - name: Provision native Caddy and exercise HTTP/WebSocket security
        run: |
          docker pull caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
          docker image save caddy:2-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794 -o .agents/native/caddy-image.tar
          python3 - <<'PY'
          import io, json, pathlib, tarfile
          with tarfile.open('.agents/native/caddy-image.tar') as image:
              manifest = json.load(image.extractfile('manifest.json'))
              for layer in manifest[0]['Layers']:
                  with tarfile.open(fileobj=io.BytesIO(image.extractfile(layer).read())) as archive:
                      for member in archive:
                          if member.name.lstrip('./') == 'usr/bin/caddy':
                              target = pathlib.Path('.agents/native/caddy')
                              target.write_bytes(archive.extractfile(member).read())
                              target.chmod(0o755)
          PY
          export CADDY_BIN="$PWD/.agents/native/caddy"
          "$CADDY_BIN" version
          python3 -m unittest discover -s infra/caddy -p 'test_*.py'
          python3 -m unittest scripts.test_add_port scripts.test_migrate_caddy_safari_session
