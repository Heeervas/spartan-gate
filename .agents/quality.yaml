schema_version: '1.0'
policy_id: repository-quality
minimum_quality_expected: top
change_scope:
  default: all
  include_untracked: true
  detect_file_renames: true
scope:
  include:
  - package.json
  - .github/workflows/ci.yml
  - apps/hermes-agent/patches/patch_external_skill_links.py
  - apps/hermes-agent/test_external_skill_links_patch.py
  - apps/hermes-agent/patches/*.py
  - apps/hermes-agent/test_*.py
  - apps/hermes-agent/proxy-bootstrap.py
  - apps/hermes-agent/Dockerfile
  - infra/pi/**
  - infra/tool-access/**
  - infra/spartan-route/**
  - scripts/check-pi-route-quality.sh
  - .ultimate/run.sh
  - .ultimate/worktree-setup.sh
  - scripts/*.py
  - scripts/configure-shared-tools.mjs
  - scripts/test_configure_shared_tools.mjs
  - scripts/doctor.sh
  - scripts/add-port.sh
  - scripts/install.sh
  - scripts/whitelist-domain.sh
  - scripts/aliases.sh
  - infra/reader/**
  - infra/hermes-plugins/**
  - infra/outbound-proxy/**
  - infra/dns/**
  - infra/caddy/**
  - infra/camofox/**
  - infra/compose/**
  exclude: []
  languages: []
baseline:
  strategy: merge_base
  ref: 75651cc0c5baa1db5a6523b790564988698f2a43
  unavailable: error
adapters:
- id: core-source
  type: builtin
  implementation: core_source_v1
  languages: []
  required_at: soft
- id: python-ast
  type: builtin
  implementation: python_ast_v1
  languages:
  - python
  required_at: standard
- id: oxlint-complexity
  type: external_json
  implementation: external_metrics_v2
  paths:
  - .cache/quality/oxlint-metrics.json
  languages:
  - javascript
  - typescript
  required_at: standard
thresholds:
  python_ast_v1.function_logical_lines:
    warning: 40
    strong: 80
  python_ast_v1.cyclomatic_v1:
    warning: 10
    strong: 15
  python_ast_v1.max_nesting:
    warning: 4
    strong: 6
  python_ast_v1.parameter_count:
    warning: 5
    strong: 8
  python_ast_v1.file_logical_lines:
    warning: 500
    strong: 900
  oxlint_v1.cyclomatic:
    warning: 10
    strong: 15
policy:
  changed_code_only: true
  untouched_existing_debt: report
  soft_new_strong: report
  standard_new_strong: exception_or_fail
  top_new_strong: exception_or_fail
  required_adapter_failure: incomplete
exceptions:
- id: pi-route-legacy-app-size
  selector:
    path: infra/spartan-route/spartan_route/app.py
    language: python
    symbol: <module>
    kind: file
  metric: python_ast_v1.file_logical_lines
  allowance:
    maximum: 2991
  rationale: Narrow additive observed-usage hooks share the existing attempt and cleanup
    lifecycle. New storage and policy logic lives in separate modules. Broad routing/module
    extraction would expand production risk beyond this feature.
  approval:
    authority: Independent GPT-6.1 Sol medium adversarial reviewer
    reference: docs/reviews/pi-route-usage-20261021.md
  created_at: '2026-10-21'
  expires_at: '2026-11-20'
