- id: pi-native-response-attempt-complexity
  selector:
    path: infra/spartan-route/spartan_route/native_responses.py
    language: python
    symbol: execute_codex_responses
    kind: function
  metric: python_ast_v1.cyclomatic_v1
  allowance:
    maximum: 75
  rationale: Native Responses owns attempt admission, retry and stream cleanup. Pi
    observation shares that exact lifecycle; broader transport extraction would increase
    this protocol change. PiAttempt retains idempotence and storage ownership.
  approval:
    authority: Independent native_responses_review agent
    reference: docs/reviews/pi-native-responses-20261023.md
