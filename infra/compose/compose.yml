name: spartan-gate

x-spartan-logging: &spartan-logging
  driver: local
  options:
    max-size: "${SPARTAN_LOG_MAX_SIZE:-10m}"
    max-file: "${SPARTAN_LOG_MAX_FILES:-3}"

services:
  edge-sessions:
    logging: *spartan-logging
    extends:
      file: edge-sessions.yml
      service: edge-sessions
  proxy:
    logging: *spartan-logging
    build:
      context: ../outbound-proxy
    image: spartan-gate-outbound-proxy:latest
    container_name: spartan_gate_proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    mem_limit: 64m
    pids_limit: 128
    environment:
      # recommended: daily runtime whitelist refresh for expired temporary domains.
      SPARTAN_WHITELIST_REFRESH_TIME: ${SPARTAN_WHITELIST_REFRESH_TIME:-02:00}
      SPARTAN_WHITELIST_REFRESH_TZ: ${SPARTAN_WHITELIST_REFRESH_TZ:-Europe/Madrid}
      SPARTAN_WHITELIST_MAX_BYTES: ${SPARTAN_WHITELIST_MAX_BYTES:-262144}
      SPARTAN_WHITELIST_MAX_ENTRIES: ${SPARTAN_WHITELIST_MAX_ENTRIES:-2048}
    volumes:
      # required: public proxy policy and publishable whitelist fragment.
      - ../outbound-proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ../outbound-proxy/whitelist.txt:/etc/tinyproxy/whitelist.public.txt:ro
    networks:
      - spartan_internal
      - spartan_external
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  searxng:
    logging: *spartan-logging
    image: searxng/searxng@sha256:8ee5966e1fe91953ed98383dce45373289f5536d0f8927cc0c0352729f8009f7
    container_name: spartan_gate_searxng
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    mem_limit: 256m
    pids_limit: 128
    volumes:
      # required: public SearXNG config, safe to publish.
      - ../../config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ../../config/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      # required: internal-only service URL.
      SEARXNG_BASE_URL: http://searxng:8080/
    networks:
      - spartan_internal
      - spartan_external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  reader:
    logging: *spartan-logging
    build:
      context: ../reader
    container_name: spartan_gate_reader
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 64
    environment:
      # required: internal reader service.
      READER_PORT: 3000
      # recommended: override from private env only if needed.
      READER_TIMEOUT: ${READER_TIMEOUT:-15}
      # recommended: bounded request execution and pending admission.
      READER_WORKERS: ${READER_WORKERS:-4}
      READER_MAX_PENDING: ${READER_MAX_PENDING:-8}
      # required: reader is the controlled direct-GET egress exception for
      # public page text; it must stay unpublished and SSRF-guarded.
      NO_PROXY: "*"
      no_proxy: "*"
    networks:
      - spartan_internal
      - spartan_external
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  dns:
    logging: *spartan-logging
    build:
      context: ../dns
    container_name: spartan_gate_dns
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    mem_limit: 32m
    pids_limit: 64
    environment:
      # recommended: daily runtime whitelist refresh for expired temporary domains.
      SPARTAN_WHITELIST_REFRESH_TIME: ${SPARTAN_WHITELIST_REFRESH_TIME:-02:00}
      SPARTAN_WHITELIST_REFRESH_TZ: ${SPARTAN_WHITELIST_REFRESH_TZ:-Europe/Madrid}
      SPARTAN_WHITELIST_MAX_BYTES: ${SPARTAN_WHITELIST_MAX_BYTES:-262144}
      SPARTAN_WHITELIST_MAX_ENTRIES: ${SPARTAN_WHITELIST_MAX_ENTRIES:-2048}
    volumes:
      # required: DNS relay script and publishable whitelist fragment.
      - ../dns/entrypoint.sh:/entrypoint.sh:ro
      - ../outbound-proxy/whitelist.txt:/etc/dns-whitelist.public.txt:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    networks:
      spartan_internal:
        ipv4_address: ${SPARTAN_DNS_IP:-172.28.0.253}
      spartan_external: {}
    healthcheck:
      test: ["CMD-SHELL", "echo test | nc -w1 127.0.0.1 53 >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  spartan-route:
    logging: *spartan-logging
    build:
      context: ../spartan-route
    container_name: spartan_gate_spartan_route
    restart: unless-stopped
    user: "${SPARTAN_ROUTE_UID:-${HERMES_UID:-1000}}:${SPARTAN_ROUTE_GID:-${HERMES_GID:-1000}}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    mem_limit: 512m
    pids_limit: 256
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      SPARTAN_ROUTE_UID: ${SPARTAN_ROUTE_UID:-${HERMES_UID:-1000}}
      SPARTAN_ROUTE_GID: ${SPARTAN_ROUTE_GID:-${HERMES_GID:-1000}}
      # required: internal OpenAI-compatible router. Spartan Route keeps the
      # ClawRoute env names for compatibility with Hermes and existing private
      # configuration.
      CLAWROUTE_HOST: 0.0.0.0
      CLAWROUTE_PORT: 18790
      CLAWROUTE_TOKEN: ${CLAWROUTE_TOKEN:-change-me-clawroute-token}

      # recommended: safe public defaults.
      CLAWROUTE_ENABLED: ${CLAWROUTE_ENABLED:-true}
      CLAWROUTE_BASELINE_MODEL: ${CLAWROUTE_BASELINE_MODEL:-openrouter/anthropic/claude-sonnet-4.6}
      CLAWROUTE_DEBUG: ${CLAWROUTE_DEBUG:-false}
      CLAWROUTE_DRY_RUN: ${CLAWROUTE_DRY_RUN:-false}
      CLAWROUTE_LOG_CONTENT: ${CLAWROUTE_LOG_CONTENT:-false}
      CLAWROUTE_PROVIDER: ${CLAWROUTE_PROVIDER:-}
      SPARTAN_ROUTE_DB_PATH: ${SPARTAN_ROUTE_DB_PATH:-/app/data/spartan-route.db}
      SPARTAN_ROUTE_CODEX_TRANSPORT: ${SPARTAN_ROUTE_CODEX_TRANSPORT:-http}
      SPARTAN_ROUTE_REALTIME_ENABLED: ${SPARTAN_ROUTE_REALTIME_ENABLED:-false}
      SPARTAN_ROUTE_REALTIME_MODEL: ${SPARTAN_ROUTE_REALTIME_MODEL:-}
      SPARTAN_ROUTE_REALTIME_CLIENTS_FILE: ${SPARTAN_ROUTE_REALTIME_CLIENTS_FILE:-}
      SPARTAN_ROUTE_TELEMETRY_QUEUE_CAPACITY: ${SPARTAN_ROUTE_TELEMETRY_QUEUE_CAPACITY:-1024}
      SPARTAN_ROUTE_TELEMETRY_RETENTION_BATCH_SIZE: ${SPARTAN_ROUTE_TELEMETRY_RETENTION_BATCH_SIZE:-256}
      SPARTAN_ROUTE_TELEMETRY_SHUTDOWN_TIMEOUT_MS: ${SPARTAN_ROUTE_TELEMETRY_SHUTDOWN_TIMEOUT_MS:-5000}
      SPARTAN_REASONING_BINDING_SECRET: ${SPARTAN_REASONING_BINDING_SECRET:-}

      # private/local: real provider keys are supplied by private/env/*.env.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      STEPFUN_API_KEY: ${STEPFUN_API_KEY:-}

      # private/local: Codex auth paths and mounts live in private/compose.local.yml.
      OPENAI_CODEX_TOKEN: ${OPENAI_CODEX_TOKEN:-}
      OPENAI_CODEX_AUTH_PATH: ${OPENAI_CODEX_AUTH_PATH:-}
      OPENAI_CODEX_AUTH_PATHS: ${OPENAI_CODEX_AUTH_PATHS:-}
      CODEX_HOME: ${CODEX_HOME:-/codex-home}
      CODEX_CACHE_LEASE_MODE: ${CODEX_CACHE_LEASE_MODE:-keyed}
      CODEX_CACHE_LEASE_MINUTES: ${CODEX_CACHE_LEASE_MINUTES:-60}
      CODEX_CACHE_LEASE_IDLE_GRACE_MINUTES: ${CODEX_CACHE_LEASE_IDLE_GRACE_MINUTES:-10}
      CODEX_TRANSIENT_5XX_COOLDOWN_MS: ${CODEX_TRANSIENT_5XX_COOLDOWN_MS:-120000}

      # required: remote API calls leave through Tinyproxy.
      http_proxy: http://proxy:8888
      https_proxy: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1,::1,hermes,spartan-route,proxy,caddy,searxng,reader,camofox
      no_proxy: localhost,127.0.0.1,::1,hermes,spartan-route,proxy,caddy,searxng,reader,camofox
    volumes:
      # required: isolated public runtime data. Change this line for a different Spartan Route data path.
      - ${SPARTAN_ROUTE_DATA_PATH:-../../runtime/spartan-route}:/app/data
      # required: public model routing config.
      - ../../config/clawroute:/app/config:ro
      # optional/private: Codex auth home, overridden by private compose for multi-slot auth.
      - ${SPARTAN_CODEX_HOME_PATH:-../../private/codex-home}:/codex-home:ro
    networks:
      - spartan_internal
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18790/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  camofox:
    logging: *spartan-logging
    profiles:
      - camofox
    build:
      context: ../camofox
      args:
        CAMOFOX_BASE_IMAGE: ${CAMOFOX_BASE_IMAGE:-ghcr.io/jo-inc/camofox-browser:1.15.0@sha256:e32beb2a6c958126bc2eb0882dedd97880bd822c0c15ea5b24cff558400664ae}
    image: ${CAMOFOX_IMAGE:-spartan-gate-camofox:1.15.0}
    container_name: spartan_gate_camofox
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    pids_limit: 512
    shm_size: 1gb
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    dns:
      - ${SPARTAN_DNS_IP:-172.28.0.253}
    environment:
      # optional: Hermes uses Camofox only when CAMOFOX_URL is set.
      CAMOFOX_PORT: 9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-change-me-camofox-access-key}
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-}
      CAMOFOX_ADMIN_KEY: ${CAMOFOX_ADMIN_KEY:-}
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
      CAMOFOX_GEOIP: ${CAMOFOX_GEOIP:-false}
      CAMOFOX_DISABLE_DEFAULT_ADDONS: ${CAMOFOX_DISABLE_DEFAULT_ADDONS:-false}
      CAMOFOX_INTERACTIVE: "off"
      CAMOFOX_ADDONS: ${CAMOFOX_ADDONS:-}
      CAMOFOX_PROFILE_DIR: /root/.camofox/profiles
      CAMOFOX_COOKIES_DIR: /root/.camofox/cookies
      CAMOFOX_TRACES_DIR: /root/.camofox/traces
      CAMOFOX_TRACES_MAX_BYTES: ${CAMOFOX_TRACES_MAX_BYTES:-52428800}
      CAMOFOX_TRACES_TTL_HOURS: ${CAMOFOX_TRACES_TTL_HOURS:-24}
      MAX_CONCURRENT_PER_USER: ${CAMOFOX_MAX_CONCURRENT_PER_USER:-2}
      SPARTAN_CAMOFOX_MAX_CONCURRENT_CREATES: ${CAMOFOX_MAX_CONCURRENT_CREATES:-1}
      MAX_SESSIONS: ${CAMOFOX_MAX_SESSIONS:-8}
      MAX_TABS_PER_SESSION: ${CAMOFOX_MAX_TABS_PER_SESSION:-4}
      MAX_TABS_GLOBAL: ${CAMOFOX_MAX_TABS_GLOBAL:-12}
      HANDLER_TIMEOUT_MS: ${CAMOFOX_HANDLER_TIMEOUT_MS:-30000}
      NAVIGATE_TIMEOUT_MS: ${CAMOFOX_NAVIGATE_TIMEOUT_MS:-25000}
      BUILDREFS_TIMEOUT_MS: ${CAMOFOX_BUILDREFS_TIMEOUT_MS:-12000}
      SESSION_TIMEOUT_MS: ${CAMOFOX_SESSION_TIMEOUT_MS:-600000}
      TAB_INACTIVITY_MS: ${CAMOFOX_TAB_INACTIVITY_MS:-300000}
      BROWSER_IDLE_TIMEOUT_MS: ${CAMOFOX_BROWSER_IDLE_TIMEOUT_MS:-300000}
      MAX_OLD_SPACE_SIZE: ${CAMOFOX_MAX_OLD_SPACE_SIZE:-256}
      SPARTAN_CAMOFOX_CGROUP_ADMISSION: "true"
      SPARTAN_CAMOFOX_MEMORY_SOFT_RATIO: ${SPARTAN_CAMOFOX_MEMORY_SOFT_RATIO:-0.75}
      SPARTAN_CAMOFOX_MEMORY_EVICT_RATIO: ${SPARTAN_CAMOFOX_MEMORY_EVICT_RATIO:-0.82}
      SPARTAN_CAMOFOX_MEMORY_RESET_RATIO: ${SPARTAN_CAMOFOX_MEMORY_RESET_RATIO:-0.70}
      SPARTAN_CAMOFOX_DEEP_TIMEOUT_MS: ${SPARTAN_CAMOFOX_DEEP_TIMEOUT_MS:-8000}
      SPARTAN_CAMOFOX_DEEP_CLEANUP_TIMEOUT_MS: ${SPARTAN_CAMOFOX_DEEP_CLEANUP_TIMEOUT_MS:-1000}
      SPARTAN_CAMOFOX_DEEP_BUSY_MAX_AGE_MS: ${SPARTAN_CAMOFOX_DEEP_BUSY_MAX_AGE_MS:-45000}
      SPARTAN_CAMOFOX_SERVER_RECOVERY_TIMEOUT_MS: ${SPARTAN_CAMOFOX_SERVER_RECOVERY_TIMEOUT_MS:-20000}
      SPARTAN_CAMOFOX_RECOVERY_DRAIN_TIMEOUT_MS: ${SPARTAN_CAMOFOX_RECOVERY_DRAIN_TIMEOUT_MS:-2000}
      SPARTAN_CAMOFOX_MONITOR_INTERVAL_SECONDS: ${SPARTAN_CAMOFOX_MONITOR_INTERVAL_SECONDS:-20}
      SPARTAN_CAMOFOX_HEALTH_TIMEOUT_SECONDS: ${SPARTAN_CAMOFOX_HEALTH_TIMEOUT_SECONDS:-10}
      SPARTAN_CAMOFOX_RECOVERY_TIMEOUT_SECONDS: ${SPARTAN_CAMOFOX_RECOVERY_TIMEOUT_SECONDS:-25}
      SPARTAN_CAMOFOX_FAILURE_THRESHOLD: ${SPARTAN_CAMOFOX_FAILURE_THRESHOLD:-3}
      SPARTAN_CAMOFOX_TERM_GRACE_SECONDS: ${SPARTAN_CAMOFOX_TERM_GRACE_SECONDS:-12}
      SPARTAN_CAMOFOX_KILL_GRACE_SECONDS: ${SPARTAN_CAMOFOX_KILL_GRACE_SECONDS:-3}
      SPARTAN_CAMOFOX_STABLE_RESET_SECONDS: ${SPARTAN_CAMOFOX_STABLE_RESET_SECONDS:-1800}
      SPARTAN_CAMOFOX_READINESS_MAX_AGE_SECONDS: ${SPARTAN_CAMOFOX_READINESS_MAX_AGE_SECONDS:-45}
      SPARTAN_CAMOFOX_MEMORY_SOFT_PERCENT: ${SPARTAN_CAMOFOX_MEMORY_SOFT_PERCENT:-82}
      SPARTAN_CAMOFOX_MEMORY_HARD_PERCENT: ${SPARTAN_CAMOFOX_MEMORY_HARD_PERCENT:-90}
      SPARTAN_CAMOFOX_BACKOFF_SECONDS: ${SPARTAN_CAMOFOX_BACKOFF_SECONDS:-0,30,120,600,1800}
      ENABLE_VNC: ${CAMOFOX_ENABLE_VNC:-0}
      VNC_PASSWORD: ${CAMOFOX_VNC_PASSWORD:-}
      VNC_BIND: 0.0.0.0
      VNC_PORT: 5900
      NOVNC_PORT: 6080

      # required: Camofox browser traffic uses Spartan Gate's outbound proxy.
      PROXY_HOST: proxy
      PROXY_PORT: 8888
      PROXY_STRATEGY: round_robin
      http_proxy: http://proxy:8888
      https_proxy: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1,::1,camofox,hermes,proxy,caddy,searxng,reader,spartan-route
      no_proxy: localhost,127.0.0.1,::1,camofox,hermes,proxy,caddy,searxng,reader,spartan-route
    volumes:
      # required: isolated Camofox storageState, cookies, and traces.
      - ../../runtime/camofox:/root/.camofox
      - camofox_watchdog:/var/lib/spartan-camofox-watchdog
    networks:
      - spartan_internal
    depends_on:
      proxy:
        condition: service_healthy
      dns:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/spartan-camofox-supervisor.py", "check"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s

  pocket-tts:
    logging: *spartan-logging
    profiles:
      - pocket-tts
    build:
      context: ../pocket-tts
    image: ${POCKET_TTS_IMAGE:-spartan-gate-pocket-tts:2.1.0}
    container_name: spartan_gate_pocket_tts
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    ulimits:
      core:
        soft: 0
        hard: 0
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    environment:
      HOME: /tmp
      POCKET_TTS_CACHE_ROOT: /models
      POCKET_TTS_MAX_TEXT_LENGTH: ${POCKET_TTS_MAX_TEXT_LENGTH:-5000}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${POCKET_TTS_DATA_PATH:-../../runtime/pocket-tts}:/models:ro
    networks:
      - pocket_tts_internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  pocket-tts-prefetch:
    logging: *spartan-logging
    profiles:
      - pocket-tts-bootstrap
    image: ${POCKET_TTS_IMAGE:-spartan-gate-pocket-tts:2.1.0}
    container_name: spartan_gate_pocket_tts_prefetch
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    entrypoint: ["python", "/app/prefetch.py"]
    dns:
      - ${SPARTAN_DNS_IP:-172.28.0.253}
    environment:
      HOME: /tmp
      POCKET_TTS_CACHE_ROOT: /models
      POCKET_TTS_MIN_FREE_BEFORE_BYTES: ${POCKET_TTS_MIN_FREE_BEFORE_BYTES:-8589934592}
      POCKET_TTS_MIN_FREE_AFTER_BYTES: ${POCKET_TTS_MIN_FREE_AFTER_BYTES:-5368709120}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      http_proxy: http://proxy:8888
      https_proxy: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1,::1,proxy,dns
      no_proxy: localhost,127.0.0.1,::1,proxy,dns
    volumes:
      - ${POCKET_TTS_DATA_PATH:-../../runtime/pocket-tts}:/models
    networks:
      - spartan_internal
    depends_on:
      proxy:
        condition: service_healthy
      dns:
        condition: service_healthy

  hermes:
    logging: *spartan-logging
    build:
      context: ../../apps/hermes-agent
    container_name: spartan_gate_hermes
    restart: unless-stopped
    dns:
      - ${SPARTAN_DNS_IP:-172.28.0.253}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      proxy:
        condition: service_healthy
      searxng:
        condition: service_healthy
      reader:
        condition: service_healthy
      dns:
        condition: service_healthy
      spartan-route:
        condition: service_healthy
      camofox:
        condition: service_healthy
        required: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 2g
    pids_limit: 512
    ulimits:
      core:
        soft: 0
        hard: 0
    command: ["gateway", "run"]
    tmpfs:
      - /tmp
      - /run:rw,exec,nosuid,nodev,size=64m,mode=755
    environment:
      # required: Hermes runtime home.
      HERMES_HOME: /opt/data
      SPARTAN_BROWSER_POLICY_ENABLED: "1"
      HERMES_MANAGED_DIR: /run/spartan-hermes-managed
      S6_BEHAVIOUR_IF_STAGE2_FAILS: "2"
      SPARTAN_HERMES_RUN_UID: ${SPARTAN_HERMES_RUN_UID:-${HERMES_UID:-${PUID:-1000}}}
      SPARTAN_HERMES_RUN_GID: ${SPARTAN_HERMES_RUN_GID:-${HERMES_GID:-${PGID:-1000}}}
      HERMES_UID: ${HERMES_UID:-}
      HERMES_GID: ${HERMES_GID:-}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      SPARTAN_PROXY_AUDIT_LOG: ${SPARTAN_PROXY_AUDIT_LOG:-stderr}
      HF_HOME: /opt/data/.cache/huggingface
      XDG_CONFIG_HOME: /opt/data/.config
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      PYTHONUSERBASE: /opt/data/.local
      PIP_TARGET: /opt/data/hermes-extra-site-py314
      npm_config_prefix: /opt/data/.local
      NPM_CONFIG_PREFIX: /opt/data/.local

      # required: local API/dashboard runtime.
      HERMES_DASHBOARD_ENABLED: "true"
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: 9119
      HERMES_DASHBOARD_INSECURE: ${HERMES_DASHBOARD_INSECURE:-1}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-change-me-dashboard-password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-change-me-dashboard-secret}
      API_SERVER_ENABLED: "true"
      API_SERVER_PORT: ${HERMES_API_PORT:-8642}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:-change-me-hermes-api-key}
      HERMES_MAX_ITERATIONS: ${HERMES_MAX_ITERATIONS:-90}
      HERMES_GATEWAY_TOKEN: ${HERMES_GATEWAY_TOKEN:-change-me-hermes-gateway-token}

      # required: Hermes talks to Spartan Route, not directly to model APIs.
      OPENAI_BASE_URL: http://spartan-route:18790/v1
      OPENAI_API_KEY: ${CLAWROUTE_TOKEN:-change-me-clawroute-token}
      CUSTOM_1_API_KEY: ${CLAWROUTE_TOKEN:-change-me-clawroute-token}
      SPARTAN_REASONING_BINDING_SECRET: ${SPARTAN_REASONING_BINDING_SECRET:-}
      # This Hermes runtime is subscription-first. API-key Responses requires a
      # separate runtime/profile with an explicit openai_api realm.
      SPARTAN_REASONING_REALM: ${SPARTAN_REASONING_REALM:-codex_subscription}

      # required: controlled browser/search/reader integrations.
      CAMOFOX_URL: ${CAMOFOX_URL:-}
      # Upstream Hermes reads CAMOFOX_API_KEY for Camofox bearer auth. Spartan
      # Gate maps that client-side value to the protected-route access key.
      CAMOFOX_API_KEY: ${CAMOFOX_ACCESS_KEY:-}
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-}
      CAMOFOX_USER_ID: ${CAMOFOX_USER_ID:-}
      CAMOFOX_SESSION_KEY: ${CAMOFOX_SESSION_KEY:-}
      HERMES_MEET_CAMOFOX_SESSION_KEY: ${HERMES_MEET_CAMOFOX_SESSION_KEY:-}
      CAMOFOX_ADOPT_EXISTING_TAB: ${CAMOFOX_ADOPT_EXISTING_TAB:-false}
      SPARTAN_INTERNAL_SUBNET: ${SPARTAN_INTERNAL_SUBNET:-172.28.0.0/24}
      PYTHONPATH: /opt/hermes/bootstrap:/opt/data/hermes-extra-site-py314:/opt/hermes
      SEARXNG_INSTANCE_URL: http://searxng:8080
      SEARXNG_URL: http://searxng:8080
      READER_PROXY_URL: http://reader:3000

      # private/local: Telegram, Discord, GitHub, Raindrop, GogCLI and profiles live in private/compose.local.yml.

      # required: all HTTP egress leaves through Tinyproxy.
      http_proxy: http://proxy:8888
      https_proxy: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal,hermes,proxy,caddy,searxng,reader,spartan-route,ollama,camofox,pocket-tts
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal,hermes,proxy,caddy,searxng,reader,spartan-route,ollama,camofox,pocket-tts
    volumes:
      # required: isolated public runtime data. Change this line for a different Hermes data path.
      - ../../runtime/hermes:/opt/data
      - type: bind
        source: ../../apps/hermes-agent/spartan_browser_policy.py
        target: /opt/hermes/bootstrap/spartan_browser_policy.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../apps/hermes-agent/spartan_browser_policy.py
        target: /opt/hermes/spartan_browser_policy.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../apps/hermes-agent/spartan-browser-policy-init.sh
        target: /etc/cont-init.d/0195-spartan-browser-policy
        read_only: true
        bind:
          create_host_path: false
      # required: curated published guides only; operator archive is never mounted.
      - ../../apps/hermes-agent/runtime-guides:/opt/data/brain/runtime_docs:ro
      # required: agent can inspect but not modify the public proxy whitelist fragment.
      - ../outbound-proxy/whitelist.txt:/etc/proxy-whitelist.public.txt:ro
      # optional: common native SYSTEM instructions; enable per profile only after patched-image recreation.
      - type: bind
        source: ../hermes-plugins/shared-masterv2
        target: /opt/data/plugins/shared-masterv2
        read_only: true
        bind:
          create_host_path: false
      # optional: Spartan Route cache-lineage plugin, enabled by user-owned Hermes config.
      - ../hermes-plugins/spartan-cache-lineage:/opt/data/plugins/spartan-cache-lineage:ro
      # optional: approval-gated fixed-workstation terminal plugin; remains disabled until explicitly enabled.
      - ../hermes-plugins/spartan-workstation-terminal:/opt/data/plugins/spartan-workstation-terminal:ro
    networks:
      - spartan_internal
      - pocket_tts_internal
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, socket, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('HERMES_API_PORT', '8642') + '/health', timeout=3).read(); socket.create_connection(('proxy', 8888), timeout=3).close(); urllib.request.urlopen('http://spartan-route:18790/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 75s

  # Opt-in shared tools. Legacy Caddy never joins tool_client_ingress.
  tool-access:
    profiles: [tool-access]
    logging: *spartan-logging
    build:
      context: ../tool-access
    image: ${SPARTAN_TOOL_ACCESS_IMAGE:-spartan-gate-tool-access:local}
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:size=16777216,mode=1777
    environment:
      POLICY_FILE: /run/tool-access/clients.json
      SEARCH_URL: http://searxng:8080
      READER_URL: http://reader:3000
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-}
      ALLOWED_HOSTS: "localhost:${SPARTAN_TOOL_EDGE_PORT:-18792},127.0.0.1:${SPARTAN_TOOL_EDGE_PORT:-18792},tool-edge:18792"
    volumes:
      # Directory mount: atomic policy rotation must become visible immediately.
      # Contains scoped token digests only, never the full private environment.
      - type: bind
        source: ../../private/tool-access
        target: /run/tool-access
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    networks:
      - tool_adapter_ingress
      - spartan_internal

  tool-edge:
    profiles: [tool-access]
    logging: *spartan-logging
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    user: "${SPARTAN_CADDY_UID:-${HERMES_UID:-1000}}:${SPARTAN_CADDY_GID:-${HERMES_GID:-1000}}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
    tmpfs:
      - /tmp:size=8388608,mode=1777
      - /config/caddy:size=8388608
      - /data/caddy:size=8388608
    ports:
      - "127.0.0.1:${SPARTAN_TOOL_EDGE_PORT:-18792}:18792"
    volumes:
      - type: bind
        source: ../caddy/Caddyfile.tools
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    networks:
      # Docker needs a normal bridge for effective loopback publication.
      # Only this fixed-target proxy joins it, never a client or backend.
      - tool_edge_publish
      - tool_client_ingress
      - tool_adapter_ingress
    depends_on:
      tool-access:
        condition: service_started

  mcphub:
    profiles: [mcphub]
    # Upstream logs include tool traffic; discard rather than retaining payloads.
    logging:
      driver: none
    image: samanhappy/mcphub:1.1.14@sha256:700013d712b7e74750bb2ce05492688833f62a39472db5e88753557002735dab
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:size=67108864,mode=1777
    environment:
      NODE_ENV: production
      USE_DB: "false"
      HOME: /state/home
      MCPHUB_SETTING_PATH: /state/mcp_settings.json
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1,::1
    entrypoint: ["/bin/sh", "/opt/spartan/entrypoint.sh"]
    volumes:
      - type: bind
        source: ${SPARTAN_MCPHUB_STATE_PATH:-../../private/mcphub}
        target: /state
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: ../mcphub/entrypoint.sh
        target: /opt/spartan/entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    dns:
      - ${SPARTAN_DNS_IP:-172.28.0.53}
    networks:
      - spartan_internal
    depends_on:
      proxy:
        condition: service_started
      dns:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    logging: *spartan-logging
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: spartan_gate_caddy
    restart: unless-stopped
    user: "${SPARTAN_CADDY_UID:-${HERMES_UID:-1000}}:${SPARTAN_CADDY_GID:-${HERMES_GID:-1000}}"
    read_only: true
    cap_drop:
      - ALL
    # The upstream binary carries cap_net_bind_service=ep and cannot exec if
    # that single capability is removed from the bounding set.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
      - /config/caddy
      - /data/caddy
    mem_limit: 64m
    pids_limit: 128
    entrypoint: ["/bin/sh", "/usr/local/bin/spartan-caddy-entrypoint"]
    ports:
      # recommended: public edge is local-only. Tailscale bind is added in private/compose.local.yml.
      - "${SPARTAN_BIND_LOCALHOST:-127.0.0.1}:${SPARTAN_GATE_PORT:-18789}:18789"
      - "${SPARTAN_BIND_LOCALHOST:-127.0.0.1}:${CLAWROUTE_EDGE_PORT:-18790}:18790"
      - "${SPARTAN_BIND_LOCALHOST:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"
      # Native MCPHub authentication, independent of browser Basic Auth.
      - "127.0.0.1:${SPARTAN_MCPHUB_PORT:-18793}:18793"
    environment:
      # recommended: auth still applies even on local/Tailscale HTTP.
      CADDY_AUTH_USER: ${CADDY_AUTH_USER:-admin}
      CADDY_AUTH_HASH: ${CADDY_AUTH_HASH:-$$2a$$14$$UMuSzA3WdVqcAwE3yvFeCO.CesMjqqGDVrxpL1s87FsWM/NRrADi2}

      # required: upstream bearer tokens injected by Caddy.
      CADDY_CAMOFOX_EDGE_TOKEN: ${CADDY_CAMOFOX_EDGE_TOKEN:-}
      CADDY_WS_EDGE_TOKEN: ${CADDY_WS_EDGE_TOKEN:-}
      CADDY_SESSION_SERVICE_KEY: ${CADDY_SESSION_SERVICE_KEY:-}
      CLAWROUTE_TOKEN: ${CLAWROUTE_TOKEN:-change-me-clawroute-token}
      HERMES_API_PORT: ${HERMES_API_PORT:-8642}
    volumes:
      # required: public HTTP edge config and static debugger/portal assets.
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/route.d:/etc/caddy/route.d:ro
      - ../caddy/entrypoint.sh:/usr/local/bin/spartan-caddy-entrypoint:ro
      - ../caddy/local.d:/etc/caddy/local.d:ro
      - ../caddy/portal.html:/srv/portal.html:ro
    depends_on:
      edge-sessions:
        condition: service_healthy
    networks:
      - spartan_internal
      - spartan_external
      - spartan_edge_auth
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 && wget -S -O /dev/null http://127.0.0.1:18789/ 2>&1 | grep -Eq 'HTTP/[0-9.]+ (400|401)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tool_edge_publish:
    driver: bridge
  tool_client_ingress:
    internal: true
  tool_adapter_ingress:
    internal: true
  spartan_edge_auth:
    internal: true
  spartan_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SPARTAN_INTERNAL_SUBNET:-172.28.0.0/24}
  pocket_tts_internal:
    driver: bridge
    internal: true
  spartan_external:
    driver: bridge

volumes:
  camofox_watchdog:
