# L3: L2 plus Spartan Route. Route has no host binding or external network;
# outbound provider requests use the same whitelist proxy as Hermes.
x-spartan-logging: &spartan-logging
  driver: local
  options:
    max-size: "${SPARTAN_LOG_MAX_SIZE:-10m}"
    max-file: "${SPARTAN_LOG_MAX_FILES:-3}"

services:
  spartan-route:
    logging: *spartan-logging
    extends:
      file: compose.spartan-route.yml
      service: spartan-route
    networks:
      - spartan_internal
    dns:
      - ${SPARTAN_DNS_IP:-172.28.0.253}
    environment:
      http_proxy: http://proxy:8888
      https_proxy: http://proxy:8888
      HTTP_PROXY: http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY: localhost,127.0.0.1,::1,hermes,spartan-route,proxy,caddy,camofox
      no_proxy: localhost,127.0.0.1,::1,hermes,spartan-route,proxy,caddy,camofox
    depends_on:
      proxy:
        condition: service_healthy
      dns:
        condition: service_healthy

  hermes:
    logging: *spartan-logging
    depends_on:
      spartan-route:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://spartan-route:18790/v1
      OPENAI_API_KEY: ${CLAWROUTE_TOKEN:-change-me-clawroute-token}
      CUSTOM_1_API_KEY: ${CLAWROUTE_TOKEN:-change-me-clawroute-token}
      NO_PROXY: localhost,127.0.0.1,::1,hermes,proxy,caddy,camofox,spartan-route
      no_proxy: localhost,127.0.0.1,::1,hermes,proxy,caddy,camofox,spartan-route
    volumes:
      - ../../../infra/hermes-plugins/spartan-cache-lineage:/opt/data/plugins/spartan-cache-lineage:ro

  caddy:
    logging: *spartan-logging
    ports:
      - "${SPARTAN_BIND_LOCALHOST:-127.0.0.1}:${CLAWROUTE_EDGE_PORT:-18790}:18790"
    volumes:
      - ../../caddy/route.d:/etc/caddy/route.d:ro
    depends_on:
      spartan-route:
        condition: service_healthy
