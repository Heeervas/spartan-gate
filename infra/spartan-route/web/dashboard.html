<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spartan Route</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f5;
      --panel: #ffffff;
      --text: #202124;
      --muted: #636a67;
      --line: #d9dfdc;
      --accent: #146b58;
      --bad: #b3261e;
      --warn: #9a5b00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151716;
        --panel: #202321;
        --text: #eff2ef;
        --muted: #a9b0ab;
        --line: #383d3a;
        --accent: #56c2a8;
        --bad: #ff897d;
        --warn: #e5ad4f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .wrap {
      width: min(1260px, calc(100vw - 32px));
      margin: 0 auto;
    }
    .top, .toolbar, .section-head, summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .top { padding: 18px 0; }
    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; }
    h3 { font-size: 14px; }
    nav, .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a, button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 10px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    nav a.current, button.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
    main { padding: 22px 0 40px; }
    input {
      min-width: 240px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    .toolbar { margin-bottom: 18px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .metric .label, .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .metric .value {
      margin-top: 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    details.panel { margin-bottom: 10px; }
    details.panel > summary {
      list-style: none;
      cursor: pointer;
    }
    details.panel > summary::-webkit-details-marker { display: none; }
    .chev {
      display: inline-block;
      width: 16px;
      color: var(--muted);
    }
    details[open] > summary .chev { transform: rotate(90deg); }
    .title {
      display: grid;
      gap: 2px;
      min-width: 240px;
    }
    .summary-metrics {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      justify-content: flex-end;
    }
    .turn-list {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }
    .turn {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
    }
    .turn summary { padding: 0; }
    .preview {
      max-width: 520px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .request-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .request {
      border-top: 1px solid var(--line);
      min-width: 0;
    }
    .request > summary {
      display: grid;
      grid-template-columns: minmax(120px, .85fr) minmax(130px, 1fr) minmax(110px, .85fr) minmax(120px, .9fr) minmax(120px, .85fr) minmax(90px, .7fr);
      gap: 10px;
      align-items: center;
      padding: 9px 6px;
      cursor: pointer;
      list-style: none;
      min-width: 0;
    }
    .request > summary::-webkit-details-marker { display: none; }
    .request > summary:hover { background: color-mix(in srgb, var(--line) 22%, transparent); }
    .request-field {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .request-model, .request-slot {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .request-tokens, .request-latency, .request-status {
      font-variant-numeric: tabular-nums;
    }
    .request-detail {
      padding: 0 6px 12px;
      display: grid;
      gap: 8px;
    }
    .request-preview {
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      background: color-mix(in srgb, var(--line) 18%, transparent);
      padding: 9px 10px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .request-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .meta-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
    }
    .trace-items {
      display: grid;
      gap: 6px;
    }
    .trace-item {
      border-left: 2px solid var(--line);
      border-radius: 4px;
      padding: 7px 9px;
      background: color-mix(in srgb, var(--line) 12%, transparent);
      font-size: 12px;
    }
    .trace-role {
      margin-right: 7px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }
    .trace-preview {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .trace-tool {
      margin-top: 4px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    @media (max-width: 1040px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { display: grid; grid-template-columns: 1fr; }
      input { min-width: 0; width: 100%; }
      .request > summary { grid-template-columns: minmax(90px, 1fr) minmax(120px, 1fr); }
      .request-slot, .request-tokens { display: none; }
      .summary-metrics { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <h1>Spartan Route</h1>
      <nav>
        <a class="current" href="/dashboard">Routing</a>
        <a href="/dashboard-codex">Codex</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="toolbar">
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token">
      <div class="actions">
        <button id="save">Save</button>
        <button id="collapse">Collapse</button>
        <button id="refresh" class="primary">Refresh</button>
      </div>
    </div>
    <section class="grid" id="metrics"></section>
    <section>
      <div class="section-head">
        <h2>Sessions</h2>
        <span class="muted" id="status"></span>
      </div>
      <div id="sessions"></div>
    </section>
  </main>
  <script>
    const tokenInput = document.getElementById('token');
    const metricsEl = document.getElementById('metrics');
    const sessionsEl = document.getElementById('sessions');
    const statusEl = document.getElementById('status');
    tokenInput.value = sessionStorage.getItem('spartanRouteToken') || '';

    document.getElementById('save').onclick = () => {
      sessionStorage.setItem('spartanRouteToken', tokenInput.value.trim());
      load();
    };
    document.getElementById('refresh').onclick = () => load();
    document.getElementById('collapse').onclick = () => {
      sessionsEl.querySelectorAll('details[open]').forEach(item => { item.open = false; });
    };

    function headers(json = false) {
      const token = tokenInput.value.trim();
      const out = token ? { Authorization: `Bearer ${token}` } : {};
      if (json) out['Content-Type'] = 'application/json';
      return out;
    }
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    }
    function num(value) {
      return Number(value || 0).toLocaleString();
    }
    function pct(value) {
      return `${Number(value || 0).toFixed(1)}%`;
    }
    function fmtTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString();
    }
    function metric(label, value, extra = '') {
      return `<div class="metric"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="muted">${esc(extra)}</div></div>`;
    }
    function metricLine(metrics = {}) {
      const latency = metrics.firstResponseLatencyMs || metrics.latencyMs || {};
      const totalLatency = metrics.totalLatencyMs || {};
      const latencySuffix = metrics.splitLatencyRequests ? 'first' : 'legacy';
      return [
        `${num(metrics.requests)} req`,
        `${pct(metrics.cacheHitPercent)} cache`,
        `${num(metrics.inputTokens)} in`,
        `${num(metrics.outputTokens)} out`,
        `${latency.avg == null ? '-' : `${latency.avg}ms ${latencySuffix}`}`,
        `${totalLatency.avg == null ? '-' : `${totalLatency.avg}ms total`}`,
        `${num(metrics.errors)} errors`,
      ].map(item => `<span>${esc(item)}</span>`).join('');
    }
    function requestPreview(row) {
      const preview = row.promptPreview || tracePreview(row);
      return preview && preview !== 'No preview' ? preview : 'No user-message preview recorded';
    }
    function tracePreview(row) {
      const items = row.context?.request_trace?.delta?.items || [];
      if (!Array.isArray(items) || items.length === 0) {
        return row.promptPreview || 'No preview';
      }
      return items.map(item => {
        const role = item.role || 'unknown';
        if (Array.isArray(item.toolCalls) && item.toolCalls.length) {
          const calls = item.toolCalls.map(call => `${call.name || 'tool'}(${(call.argumentKeys || []).join(', ') || `${call.argumentChars || 0} chars`})`).join('; ');
          return `${role}: ${calls}`;
        }
        return `${role}: ${item.preview || `${item.chars || 0} chars`}`;
      }).join('\n');
    }
    function renderTraceItems(row) {
      const items = row.context?.request_trace?.delta?.items || [];
      if (!Array.isArray(items) || items.length === 0) {
        return '<div class="trace-items"><div class="trace-item">No recorded trace items.</div></div>';
      }
      return `<div class="trace-items">${items.map(item => {
        const tools = (item.toolCalls || []).map(call => {
          const keys = (call.argumentKeys || []).join(', ') || `${call.argumentChars || 0} chars`;
          return `<div class="trace-tool">tool ${esc(call.name || 'tool')}(${esc(keys)})</div>`;
        }).join('');
        return `<div class="trace-item"><span class="trace-role">${esc(item.role || 'unknown')}</span><span class="trace-preview">${esc(item.preview || `${item.chars || 0} chars`)}</span>${tools}</div>`;
      }).join('')}</div>`;
    }
    function renderRequest(row) {
      const preview = requestPreview(row);
      const slot = row.selectedCodexSlotIndex ?? '-';
      const account = row.selectedCodexAccountKey || '';
      const total = row.totalResponseTimeMs || 0;
      const latencyKind = row.latencySource === 'legacy_response_time' ? 'legacy' : 'first';
      const status = row.error || 'ok';
      return `<details class="request${row.error ? ' error' : ''}">
        <summary title="${esc(preview)}">
          <span class="request-field">${esc(fmtTime(row.timestamp))}</span>
          <span class="request-field request-model">${esc(row.actualModel)}</span>
          <span class="request-field request-slot">slot ${esc(slot)}${account ? ` · ${esc(account)}` : ''}</span>
          <span class="request-field request-tokens">${num(row.inputTokens)} in · ${num(row.cachedInputTokens)} cached · ${num(row.outputTokens)} out</span>
          <span class="request-field request-latency">${esc(row.responseTimeMs || 0)}ms ${esc(latencyKind)} · ${esc(total)}ms total</span>
          <span class="request-field request-status ${row.error ? 'bad' : ''}">${esc(status)}</span>
        </summary>
        <div class="request-detail">
          <div class="request-preview">${esc(preview)}</div>
          <div class="request-meta">
            <span class="meta-pill">${esc(row.originalModel)} to ${esc(row.routedModel)}</span>
            <span class="meta-pill">${esc(row.tier || 'unknown')}</span>
            <span class="meta-pill">${esc(row.requestId || 'no request id')}</span>
            ${row.context?.request_trace?.delta?.phase ? `<span class="meta-pill">${esc(row.context.request_trace.delta.phase)}</span>` : ''}
          </div>
          ${renderTraceItems(row)}
        </div>
      </details>`;
    }
    async function getJson(path) {
      const response = await fetch(path, { headers: headers() });
      if (!response.ok) throw new Error(`${path} HTTP ${response.status}`);
      return await response.json();
    }
    async function loadTurn(turnId, target) {
      target.innerHTML = '<p class="muted">Loading turn...</p>';
      const payload = await getJson(`/api/routing/turns/${encodeURIComponent(turnId)}`);
      const rows = payload.requests || [];
      target.innerHTML = `<div class="request-list">${rows.map(renderRequest).join('') || '<div class="muted">No request detail is available.</div>'}</div>`;
    }
    function wireLazyTurns() {
      sessionsEl.querySelectorAll('details.turn').forEach(item => {
        item.addEventListener('toggle', async () => {
          if (!item.open || item.dataset.loaded === '1') return;
          const target = item.querySelector('.turn-requests');
          try {
            await loadTurn(item.dataset.turnId, target);
            item.dataset.loaded = '1';
          } catch (error) {
            target.innerHTML = `<p class="bad">${esc(error.message)}</p>`;
          }
        });
      });
    }
    function renderStats(stats) {
      const totals = stats.totals || {};
      const today = stats.today || {};
      const latency = today.firstResponseLatencyMs || stats.latencyToday || {};
      const totalLatency = today.totalLatencyMs || {};
      const firstLabel = today.splitLatencyRequests ? 'First response' : 'Legacy response';
      const latencyExtra = [
        `p90 ${latency.p90 == null ? '-' : `${latency.p90}ms`}`,
        today.splitLatencyRequests ? `${today.splitLatencyRequests} split` : '',
        today.legacyLatencyRequests ? `${today.legacyLatencyRequests} legacy` : '',
      ].filter(Boolean).join(' · ');
      metricsEl.innerHTML = [
        metric('Today requests', today.loggedRequests || 0, `${today.usageSeenRequests || 0} with usage`),
        metric('Today cache', pct(today.cacheHitPercent), `${num(today.cachedInputTokens)} cached`),
        metric(firstLabel, latency.avg == null ? '-' : `${latency.avg}ms`, latencyExtra),
        metric('Total duration', totalLatency.avg == null ? '-' : `${totalLatency.avg}ms`, `p90 ${totalLatency.p90 == null ? '-' : `${totalLatency.p90}ms`}`),
        metric('Today errors', today.errors || 0, `${today.usageMissingRequests || 0} missing usage`),
        metric('All cache', pct(totals.cacheHitPercent), `${num(totals.requests)} usage rows`),
      ].join('');
    }
    function renderSessions(payload) {
      const sessions = payload.sessions || [];
      statusEl.textContent = `${sessions.length} shown${payload.hasMoreSessions ? ', more in DB' : ''}`;
      sessionsEl.innerHTML = sessions.map((session, index) => {
        const turns = session.turns || [];
        return `<details class="panel" ${index === 0 ? 'open' : ''}>
          <summary>
            <span class="title"><strong><span class="chev">›</span>${esc(session.id)}</strong><span class="muted">${esc(fmtTime(session.lastAt))} - ${esc(session.turnCount || turns.length)} turns</span></span>
            <span class="summary-metrics">${metricLine(session.metrics)}</span>
          </summary>
          <div class="turn-list">
            ${turns.map(turn => `<details class="turn" data-turn-id="${esc(turn.id)}">
              <summary>
                <span class="title"><strong><span class="chev">›</span>${esc(turn.id)}</strong><span class="preview">${esc(turn.promptPreview || (turn.models || []).join(', ') || 'No preview')}</span></span>
                <span class="summary-metrics">${metricLine(turn.metrics)}</span>
              </summary>
              <div class="turn-requests"></div>
            </details>`).join('')}
            ${session.hasMoreTurns ? '<p class="muted">Older turns hidden by current limit.</p>' : ''}
          </div>
        </details>`;
      }).join('') || '<div class="panel muted">No routing rows yet.</div>';
      wireLazyTurns();
    }
    async function load() {
      try {
        statusEl.textContent = 'Loading...';
        const [stats, live] = await Promise.all([
          getJson('/stats'),
          getJson('/api/routing/live?sessionLimit=30&turnLimit=12'),
        ]);
        renderStats(stats);
        renderSessions(live);
      } catch (error) {
        statusEl.textContent = '';
        sessionsEl.innerHTML = `<div class="panel bad">${esc(error.message)}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
