<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spartan Route</title>
  <link rel="stylesheet" href="/dashboard-assets/dashboard.css">
</head>
<body class="routing-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <div class="wrap top">
      <a class="brand" href="/dashboard" aria-label="Spartan Route home"><svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 22V6h18v16M5 14h18M10 6v8m8 0v8" stroke="currentColor" stroke-width="2"/><path d="M10 10h8" stroke="currentColor" stroke-width="2"/></svg><span>Spartan Route</span></a>
      <nav aria-label="Dashboard">
        <a class="current" href="/dashboard" aria-current="page">Routing</a>
        <a href="/dashboard-codex">Codex</a>
        <a href="/dashboard-config">Config</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main">
    <div class="page-heading"><div><h1>Routing activity</h1><p>Requests, sessions and the route each turn takes.</p></div><span class="scope-label">Operator console</span></div>
    <div class="toolbar" aria-label="Dashboard access and refresh">
      <label class="token-field" for="token">
        <span class="label">Dashboard access · Bearer token</span>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Enter bearer token">
      </label>
      <div class="actions">
        <button id="save">Use token</button>
        <button id="collapse">Collapse</button>
        <button id="refresh" class="primary">Refresh</button>
      </div>
    </div>
    <details class="filter-disclosure"><summary>Filter activity</summary><div class="filters" aria-label="Routing filters">
      <label class="filter-field" for="model-filter">
        <span class="muted">Model</span>
        <select id="model-filter"><option value="">All models</option></select>
      </label>
      <label class="filter-field" for="reasoning-filter">
        <span class="muted">Reasoning</span>
        <select id="reasoning-filter"><option value="">All reasoning</option></select>
      </label>
      <label class="filter-field" for="prompt-filter">
        <span class="muted">Prompt starts with / contains</span>
        <input id="prompt-filter" type="search" maxlength="300" autocomplete="off">
      </label>
      <button id="clear-filters" type="button">Clear filters</button>
    </div>
    </details>
    <div class="filter-status muted" id="filter-status" role="status" aria-live="polite"></div>
    <section class="grid metric-strip" id="metrics" aria-label="Routing totals"></section>
    <section>
      <div class="section-head">
        <h2>Sessions</h2>
        <span class="muted" id="status" role="status" aria-live="polite"></span>
      </div>
      <p class="muted">Related conversations stay separate. Cache observations are passive comparisons of requests, not extra model calls.</p>
      <div id="sessions"></div>
    </section>
  </main>
  <script defer src="/dashboard-assets/dashboard.js"></script>
</body>
</html>
