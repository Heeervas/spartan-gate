<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spartan Route</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f5;
      --panel: #ffffff;
      --text: #202124;
      --muted: #636a67;
      --line: #d9dfdc;
      --accent: #146b58;
      --bad: #b3261e;
      --warn: #9a5b00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151716;
        --panel: #202321;
        --text: #eff2ef;
        --muted: #a9b0ab;
        --line: #383d3a;
        --accent: #56c2a8;
        --bad: #ff897d;
        --warn: #e5ad4f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .wrap {
      width: min(1260px, calc(100vw - 32px));
      margin: 0 auto;
    }
    .top, .toolbar, .section-head, summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .top { padding: 18px 0; }
    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; }
    h3 { font-size: 14px; }
    nav, .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a, button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 10px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    nav a.current, button.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
    nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 2px;
    }
    main { padding: 22px 0 40px; }
    input {
      min-width: 240px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    .toolbar { margin-bottom: 12px; }
    .token-field { display: grid; gap: 4px; min-width: 240px; }
    .filters {
      display: grid;
      grid-template-columns: minmax(180px, .8fr) minmax(150px, .6fr) minmax(260px, 1.4fr) auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 8px;
    }
    .filter-field { display: grid; gap: 4px; min-width: 0; }
    .filter-field input, .filter-field select {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    .filter-status { min-height: 20px; margin-bottom: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .metric .label, .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .metric .value {
      margin-top: 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    details.panel { margin-bottom: 10px; }
    details.panel > summary {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(460px, .9fr);
      list-style: none;
      cursor: pointer;
    }
    details.panel > summary::-webkit-details-marker { display: none; }
    .chev {
      display: inline-block;
      width: 16px;
      color: var(--muted);
    }
    details[open] > summary .chev { transform: rotate(90deg); }
    .title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .activity-title {
      display: -webkit-box;
      overflow: hidden;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
    }
    .summary-metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(72px, 1fr));
      gap: 6px;
      min-width: 0;
    }
    .fact {
      display: grid;
      align-content: start;
      gap: 2px;
      min-width: 0;
      border-left: 1px solid var(--line);
      padding-left: 8px;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
    .fact-label, .field-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .turn-list {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }
    .turn {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
    }
    .turn > summary {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(460px, .9fr);
      padding: 0;
    }
    .preview {
      max-width: 520px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .request-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .request {
      border-top: 1px solid var(--line);
      min-width: 0;
    }
    .request > summary {
      display: grid;
      grid-template-columns: minmax(120px, .8fr) repeat(4, minmax(100px, .8fr)) minmax(150px, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 6px;
      cursor: pointer;
      list-style: none;
      min-width: 0;
    }
    .request-primary {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .request > summary::-webkit-details-marker { display: none; }
    .request > summary:hover { background: color-mix(in srgb, var(--line) 22%, transparent); }
    .request-field {
      display: grid;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .request-model, .request-slot {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .request-tokens, .request-latency, .request-status {
      font-variant-numeric: tabular-nums;
    }
    .request-detail {
      padding: 0 6px 12px;
      display: grid;
      gap: 8px;
    }
    .request-preview {
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      background: color-mix(in srgb, var(--line) 18%, transparent);
      padding: 9px 10px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .request-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .meta-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
    }
    .trace-items {
      display: grid;
      gap: 6px;
    }
    .trace-item {
      border-left: 2px solid var(--line);
      border-radius: 4px;
      padding: 7px 9px;
      background: color-mix(in srgb, var(--line) 12%, transparent);
      font-size: 12px;
    }
    .trace-role {
      margin-right: 7px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }
    .trace-preview {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .trace-tool {
      margin-top: 4px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .diagnostics {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .diagnostics > summary {
      display: inline-flex;
      justify-content: flex-start;
      min-height: 36px;
      padding: 8px 0;
      cursor: pointer;
    }
    .diagnostics > summary::before {
      content: "›";
      margin-right: 6px;
      transition: transform .15s ease;
    }
    .diagnostics[open] > summary::before { transform: rotate(90deg); }
    .diagnostic-list {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .diagnostic-list button { flex: 0 0 auto; font-family: inherit; }
    .session-diagnostics {
      border-top: 1px solid var(--line);
      padding-top: 4px;
    }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    @media (max-width: 1040px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .wrap { width: min(100% - 24px, 1260px); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar, .filters { display: grid; grid-template-columns: 1fr; }
      input { min-width: 0; width: 100%; }
      button, nav a { min-height: 44px; }
      .actions { width: 100%; }
      .actions button { flex: 1 1 auto; }
      .metric, .panel { padding: 12px; }
      details.panel > summary, .turn > summary { grid-template-columns: minmax(0, 1fr); }
      .summary-metrics {
        width: 100%;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .request > summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .request-primary, .request-latency { grid-column: 1 / -1; }
      .request-field { white-space: normal; overflow-wrap: anywhere; }
      .diagnostic-list { align-items: stretch; flex-direction: column; }
      .diagnostic-list button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <h1>Spartan Route</h1>
      <nav aria-label="Dashboard">
        <a class="current" href="/dashboard" aria-current="page">Routing</a>
        <a href="/dashboard-codex">Codex</a>
        <a href="/dashboard-config">Config</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="toolbar">
      <label class="token-field" for="token">
        <span class="label">Bearer token</span>
        <input id="token" type="password" autocomplete="off">
      </label>
      <div class="actions">
        <button id="save">Use token</button>
        <button id="collapse">Collapse</button>
        <button id="refresh" class="primary">Refresh</button>
      </div>
    </div>
    <div class="filters" aria-label="Routing filters">
      <label class="filter-field" for="model-filter">
        <span class="muted">Model</span>
        <select id="model-filter"><option value="">All models</option></select>
      </label>
      <label class="filter-field" for="reasoning-filter">
        <span class="muted">Reasoning</span>
        <select id="reasoning-filter"><option value="">All reasoning</option></select>
      </label>
      <label class="filter-field" for="prompt-filter">
        <span class="muted">Prompt starts with / contains</span>
        <input id="prompt-filter" type="search" maxlength="300" autocomplete="off">
      </label>
      <button id="clear-filters" type="button">Clear filters</button>
    </div>
    <div class="filter-status muted" id="filter-status" role="status" aria-live="polite"></div>
    <section class="grid" id="metrics"></section>
    <section>
      <div class="section-head">
        <h2>Sessions</h2>
        <span class="muted" id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="sessions"></div>
    </section>
  </main>
  <script defer src="/dashboard-assets/dashboard.js"></script>
</body>
</html>
